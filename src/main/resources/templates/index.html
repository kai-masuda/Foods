<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>冷蔵庫管理アプリ</title>
    <style>
        .expired { color: red; font-weight: bold; }       /* 期限切れ：赤 */
        .warning { color: orange; font-weight: bold; }    /* 3日以内：オレンジ */
        .safe { color: black; }                           /* 安全：黒 */
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .recipe-btn-container { margin: 15px 0; }
        .batch-btn { background-color: #4285F4; color: white; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .batch-btn:hover { background-color: #357ae8; }
    </style>
</head>
<body>

    <h1>冷蔵庫の中身管理</h1>
    <p>今日の日付: <span th:text="${today}">2026-06-01</span></p>

    <!-- 食材検索フォーム -->
    <form th:action="@{/ingredients}" method="get">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="食材名で検索">
        <button type="submit">検索</button>
        <a th:href="@{/ingredients}"><button type="button">クリア</button></a>
    </form>
    <br>

    <!-- 食材登録フォーム -->
    <h3>🛒 食材の追加</h3>
    <form th:action="@{/ingredients/add}" method="post">
        <input type="text" name="name" placeholder="食材名" required>
        <input type="date" name="expiryDate" required>
        <input type="number" name="quantity" placeholder="数量" required>
        <select name="unit">
            <option value="個">個</option>
            <option value="g">g</option>
        </select>
        <button type="submit">登録</button>
    </form>
    <br>

    <!-- 一覧表示（期限順） -->
    <h3>📦 食材一覧</h3>

    <!-- 複数選択レシピ検索ボタン -->
    <div class="recipe-btn-container">
        <button type="button" class="batch-btn" onclick="searchMultipleRecipes()">🔍 選択した食材でレシピ検索</button>
        <small style="color: #666; margin-left: 10px;">※使いたい食材にチェックを入れてから押してください</small>
    </div>

    <table>
        <tr>
            <th style="width: 40px; text-align: center;">選択</th>
            <th>食材名</th>
            <th>数量</th>
            <th>期限</th>
            <th>更新日</th>
            <th>消費</th>
            <th>単体レシピ</th>
        </tr>
        <tr th:each="item : ${ingredients}">
            <!-- 複数選択用のチェックボックス（valueに食材名をセット） -->
            <td style="text-align: center;">
                <input type="checkbox" class="ingredient-checkbox" th:value="${item.name}">
            </td>
            <!-- 期限切れ・期限間近の色変更ロジック -->
            <td th:class="${item.expiryDate.isBefore(today)} ? 'expired' : (${item.expiryDate.isBefore(today.plusDays(4))} ? 'warning' : 'safe')">
                <span th:text="${item.name}"></span>
            </td>
            <td th:text="${item.quantity} + ${item.unit}"></td>
            <td th:text="${item.expiryDate}"></td>
            <td th:text="${item.updatedAt}"></td>
            <td>
                <!-- 任意の量で消費するボタン -->
                <form th:action="@{/ingredients/consume/{id}(id=${item.id})}" method="post" style="display:inline;">
                    <input type="number" name="amount" placeholder="消費量" style="width:60px;" required>
                    <button type="submit">消費</button>
                </form>
            </td>
            <td>
                <!-- 単体検索（Google用） -->
                <form action="https://google.com" method="get" target="_blank" style="display:inline;">
                    <input type="hidden" name="q" th:value="${item.name}">
                    <input type="hidden" name="q" value="レシピ">
                    <button type="submit" style="background:none; border:none; color:blue; text-decoration:underline; cursor:pointer; font-weight:bold;">🔍 単品</button>
                </form>
            </td>
        </tr>
    </table>

    <!-- ★複数選択検索用の隠しフォーム（Google配信用に action と name を修正） -->
    <form id="hiddenBatchForm" action="https://google.com" method="get" target="_blank">
        <input type="hidden" id="hiddenKeyword" name="q">
    </form>

    <!-- 複数食材を合体させるJavaScript -->
    <script>
        function searchMultipleRecipes() {
            // チェックされている全てのチェックボックスを取得
            const checkboxes = document.querySelectorAll('.ingredient-checkbox:checked');
            
            if (checkboxes.length === 0) {
                alert('食材を1つ以上選択してください！');
                return;
            }

            // チェックされた食材の名前を配列に集める
            const selectedIngredients = [];
            checkboxes.forEach(cb => {
                selectedIngredients.push(cb.value);
            });

            // 食材名を半角スペースで繋ぎ、最後に「レシピ」というワードを合体させる
            // 例: "豚バラ キャベツ レシピ"
            const searchKeyword = selectedIngredients.join(' ') + ' レシピ';

            // 隠しフォームの値を書き換えて自動送信
            document.getElementById('hiddenKeyword').value = searchKeyword;
            document.getElementById('hiddenBatchForm').submit();
        }
    </script>

</body>
</html>
