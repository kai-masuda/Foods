<!DOCTYPE html>
<!-- 【修正】www. を追加して正しいThymeleafのURLに修正しました -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>食材編集</title>
    <!-- 作成した最低限のローカルCSSを読み込みます -->
        <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 card-title mb-4">食材の編集</h1>
                
                <form th:action="@{/foods/{id}/update(id=${food.id})}" th:object="${food}" method="post">
                    <!-- 食材名 -->
                    <div class="mb-3">
                        <label for="foodName" class="form-label">食材名</label>
                        <input type="text" th:field="*{foodName}" class="form-control" required>
                    </div>
                    
                    <!-- 数量 -->
                    <div class="mb-3">
                        <label for="amount" class="form-label">量</label>
                        <input type="number" th:field="*{amount}" class="form-control" min="1" required>
                    </div>
                    
                    <!-- 賞味期限 -->
                    <div class="mb-3">
                        <label for="taste_limit" class="form-label">賞味・消費期限</label>
                        <input type="date" th:field="*{taste_limit}" class="form-control" required>
                    </div>
                    
                    <!-- カテゴリ選択 -->
                    <div class="mb-4">
                        <label for="category" class="form-label">カテゴリ</label>
                        <!-- 【修正】エラーの原因だった th:selected を削除しました。th:field の効果で自動選択されます -->
                        <select th:field="*{category}" class="form-select" required>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName + ' (' + cat.unit + ')'}"></option>
                        </select>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success w-100">更新する</button>
                        <a th:href="@{/foods}" class="btn btn-secondary w-100">戻る</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
