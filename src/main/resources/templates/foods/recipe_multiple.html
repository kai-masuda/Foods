<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AIおすすめレシピ</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 800px;">
        <div class="card shadow">
            <div class="card-header bg-info text-white">
                <h2 class="h4 mb-0">🍳 AIシェフの特製レシピ</h2>
            </div>
            <div class="card-body">
                <div id="loading" class="text-center my-5">
                    <div class="spinner-border text-info" role="status"></div>
                    <p class="mt-3 text-muted">冷蔵庫の食材からレシピを考えています。少々お待ちください...</p>
                </div>
                
                <div id="recipe-result" style="white-space: pre-wrap; font-size: 1.1rem; line-height: 1.8;"></div>
                
                <hr>
                <div class="text-center mt-4">
                    <a th:href="@{/foods}" class="btn btn-secondary">食材一覧に戻る</a>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // Javaから渡されたfoodIdsをJavaScriptの配列として取得
        const foodIds = [[${foodIds}]];
        
        // パラメータ文字列を組み立てる (例: foodIds=1&foodIds=3)
        const params = foodIds.map(id => `foodIds=${id}`).join('&');
        
        const resultDiv = document.getElementById('recipe-result');
        const loadingDiv = document.getElementById('loading');

        // 裏方のAI専用URLを呼び出す
        const eventSource = new EventSource('/foods/recipe/stream?' + params);

        eventSource.onmessage = function(event) {
            // ローディングを消す
            loadingDiv.style.display = 'none';
            
            // 終了フラグが来たら通信を閉じる
            if (event.data.includes('[DONE]')) {
                eventSource.close();
                return;
            }
            
            // 文字を画面に追加していく
            resultDiv.innerText += event.data;
        };

        eventSource.onerror = function() {
            eventSource.close();
        };
    </script>
</body>
</html>
