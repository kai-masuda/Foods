<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AIレシピ提案</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 800px;">

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">🍳 AIレシピ提案</h5>
                <span class="badge bg-light text-dark" th:text="${food.foodName}">食材名</span>
            </div>
            
            <div class="card-body p-4">
                <div class="p-4 bg-white border rounded shadow-inner" 
                     style="white-space: pre-wrap; font-size: 1.1rem; line-height: 1.8; min-height: 200px;">
                    <span th:text="${recipe}"></span>
                </div>
            </div>
            
            <div class="card-footer bg-white text-end">
                <a th:href="@{/foods}" class="btn btn-secondary">食材一覧に戻る</a>
            </div>
        </div>
        
    </div>
</body>
</html>
