<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>食材一覧</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">食材一覧</h1>
            
            <!--【修正】並び替え機能追加-->
            <form th:action="@{/foods}" method="get" class="d-flex gap-2 align-items-center bg-white p-2 rounded shadow-sm border">
                <span class="small fw-bold text-muted ms-1">並び替え:</span>
                
                <select name="sort" class="form-select form-select-sm" style="width: 150px;">
                    <option value="tasteLimit" th:selected="${currentSort == 'tasteLimit'}">賞味・消費期限</option>
                    <option value="foodName" th:selected="${currentSort == 'foodName'}">食材名</option>
                    <option value="amount" th:selected="${currentSort == 'amount'}">量</option>
                    <option value="id" th:selected="${currentSort == 'id'}">登録順(ID)</option>
                </select>
                
                <select name="direction" class="form-select form-select-sm" style="width: 110px;">
                     <option value="asc" th:selected="${currentDirection == 'asc'}">昇順(▲)</option>
                     <option value="desc" th:selected="${currentDirection == 'desc'}">降順(▼)</option>
                </select>

                <button type="submit" class="btn btn-sm btn-secondary px-3">実行</button>
            </form>                
            
            <a th:href="@{/foods/new}" class="btn btn-primary">新規登録</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/foods}" method ="get" class="row g-3 align-items-center">
                    <div class="col-md-8 col-sm-9">
                        <div class="input-group">
                            <span class="input-group-text">食材名</span>
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="検索したいキーワードを入力してください">
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-3 d-flex gap-2">
                        <button type="submit" class="btn btn-success w-100">検索</button>
                        <a th:href="@{/foods}" class="btn btn-secondary">クリア</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID </th>
                            <th>食材名</th>
                            <th>量</th>
                            <th>単位</th>
                            <th>賞味・消費期限</th>
                            <th>カテゴリ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="food : ${foods}">
                            <td th:text="${food.id}">1</td>
                            <td th:text="${food.foodName}">トマト</td>
                            <td th:text="${food.amount}">3</td>
                            <td th:text="${food.category != null ? food.category.unit : ''}">個</td>
                            <td th:text="${food.tasteLimit}">2026-06-10</td>
                            <td th:text="${food.category != null ? food.category.categoryName : '未設定'}">野菜</td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/foods/{id}/edit(id=${food.id})}"
                                        class="btn btn-sm btn-warning">編集</a>

                                    <!-- 【修正】数量を指定して消費（削除）するフォームに変更 -->
                                    <!--【修正】最小値を0.1に変更し、ste="any"で値を自由に入力できるように変更-->
                                    <form th:action="@{/foods/{id}/delete(id=${food.id})}" method="post"
                                        class="d-flex gap-1 align-items-center">
                                        <input type="number" name="reduceAmount" class="form-control form-control-sm"
                                            style="width: 70px;" min="0.1" th:max="${food.amount}" value="1" step="any" required>
                                        <button type="submit" class="btn btn-sm btn-danger"
                                            style="white-space: nowrap;">消費</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(foods)}">
                            <td colspan="7" class="text-center text-muted py-4">食材が登録されていません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
