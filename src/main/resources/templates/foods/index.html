<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>食材一覧</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">

        <!-- ヘッダー -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">食材一覧</h1>

            <!--【修正】ユーザー名を表示--> 
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted small">
                    👤 <strong th:text="${loginUser}">ユーザー名</strong> さん、こんにちは
                </span>
                <!-- ログアウトボタン -->
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger">ログアウト</button>
                </form>

            </div>
        </div>

        <!-- 検索フォーム -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/foods}" method="get" class="row g-3 align-items-center">

                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text">食材名</span>
                            <input type="text" name="keyword" th:value="${currentKeyword}" class="form-control"
                                placeholder="キーワードを入力">
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="input-group">
                            <span class="input-group-text">カテゴリ</span>
                            <select name="categoryNames" class="form-select">
                                <option value="">すべて</option>
                                
                                <option th:each="name : ${categoryNames}" th:value="${name}"
                                    th:text="${name}"
                                    th:selected="${name == currentCategoryName}">野菜</option>
                            </select>
                        </div>
                    </div>
                   

                    <div class="col-md-2">
                        <select name="sort" class="form-select">
                            <option value="tasteLimit" th:selected="${currentSort == 'tasteLimit'}">賞味・消費期限</option>
                            <option value="foodName" th:selected="${currentSort == 'foodName'}">食材名</option>
                            <option value="amount" th:selected="${currentSort == 'amount'}">量</option>
                            <option value="id" th:selected="${currentSort == 'id'}">登録順(ID)</option>
                        </select>
                    </div>
                   

                    <div class="col-md-1">
                        <select name="direction" class="form-select">
                            <option value="asc" th:selected="${currentDirection == 'asc'}">昇順</option>
                            <option value="desc" th:selected="${currentDirection == 'desc'}">降順</option>
                        </select>
                    </div>
                    

                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-success w-100">検索</button>
                        <a th:href="@{/foods}" class="btn btn-secondary">クリア</a>
                    </div>

                </form>
            </div>
        </div>
        <br>

        <form th:action="@{/foods/recipe/generate}" method="get">
            <div class="d-flex gap-2 mb-3">
                <a th:href="@{/foods/new}" class="btn btn-primary">新規登録</a>
                <button type="submit" class="btn btn-info text-white">
                    🍳選択した食材でレシピ作成
                </button>
            </div>
        
            
                
            <!-- 食材一覧 -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>レシピ検索</th>
                                <th>No.</th>
                                <th>食材名</th>
                                <th>量</th>
                                <th>単位</th>
                                <th>賞味・消費期限</th>
                                <th>カテゴリ</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="food : ${foods}">
                                <td>
                                    <input type="checkbox" name="foodIds" th:value="${food.id}" />
                                </td>
                                  
                                <td th:text="${foodStat.count}">1</td>
                                <td th:text="${food.foodName}">トマト</td>
                                <td th:text="${food.amount}">3</td>
                                <td th:text="${food.category != null ? food.category.unit.unitName : ''}">個</td>
    
                                <td th:text="${food.tasteLimit}"
                                    th:classappend="${food.isExpired()} ? 'text-expired' : (${food.isUrgent()} ? 'text-urgent' : '')">
                                    2026-06-05
                                </td>
    
                                <td th:text="${food.category != null ? food.category.categoryName : '未設定'}">野菜</td>
                                <td>
                                    <div class="d-flex gap-2">
                                        
                                        <a th:href="@{/foods/{id}/edit(id=${food.id})}"
                                            class="btn btn-sm btn-warning">編集</a>
    
                                        <!-- 数量を指定して消費（削除）するフォーム -->
                                        <form th:action="@{/foods/{id}/delete(id=${food.id})}" method="post"
                                            class="d-flex gap-1 align-items-center">
                                            <input type="number" name="reduceAmount" class="form-control form-control-sm"
                                                style="width: 70px;" min="0.1" th:max="${food.amount}" value="1" step="any"
                                                required>
                                            <button type="submit" class="btn btn-sm btn-danger"
                                                style="white-space: nowrap;">消費</button>
                                        </form>
                                                                           
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(foods)}">
                                <td colspan="7" class="text-center text-muted py-4">食材が登録されていません。</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
