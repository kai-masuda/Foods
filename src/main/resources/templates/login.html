<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <!-- 共通のCSSを読み込み -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* ログイン画面を画面の中央に配置するための専用のスタイル */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
        }
        .text-center {
            text-align: center;
        }
        .mt-3 {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- style.cssの .container クラスを適用 -->
        <div class="container login-box">
            
            <h1 class="text-center" style="margin-top: 0; margin-bottom: 20px;">ログイン</h1>

            <!-- メッセージ表示エリア（style.cssの .error と .success を適用） -->
            <div class="mb-3">
                <div th:if="${param.error}" class="error">
                    ユーザー名またはパスワードが正しくありません。
                </div>
                <div th:if="${param.logout}" class="success">
                    ログアウトしました。
                </div>
                <div th:if="${registerSuccess}" class="success">
                    ユーザー登録に成功しました。ログインしてください。
                </div>
            </div>

            <form th:action="@{/login}" method="post">
                <!-- ユーザー名 -->
                <div class="mb-3">
                    <label th:for="username" class="form-label">ユーザー名:</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>

                <!-- パスワード -->
                <div class="mb-4">
                    <label th:for="password" class="form-label">パスワード:</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <!-- ログインボタン -->
                <div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">ログイン</button>
                </div>
            </form>

            <!-- 会員登録リンク -->
            <p class="text-center mt-3" style="font-size: 14px; margin-bottom: 0;">
                アカウントをお持ちでない方は <a th:href="@{/register}">こちら</a> から登録してください。
            </p>
            
        </div>
    </div>

</body>
</html>
