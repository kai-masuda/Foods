spring.application.name=Foods
# データベースの設定
spring.datasource.url=jdbc:mysql://localhost:3306/food_board?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=devuser
spring.datasource.password=password

# 【修正】起動時にデータを消さず、変更があった場合のみテーブル構造を更新する設定に変更
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# Thymeleaf設定
spring.thymeleaf.cache=false

# Ollama設定
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=Qwen2.5:1.5b
